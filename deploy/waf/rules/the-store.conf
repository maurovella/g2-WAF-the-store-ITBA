# =============================================================================
# Reglas custom de ModSecurity para The Store
# WAF para The Store · ModSecurity v3 + OWASP CRS sobre ingress-nginx
# =============================================================================
#
# Este archivo se monta como volumen en el ingress-nginx-controller (vía la
# ConfigMap `modsec-custom-rules`) en /etc/nginx/modsecurity-custom/ y se carga
# con un `Include` desde el `modsecurity-snippet` global del controller.
#
# DOS decisiones de formato, ambas para sobrevivir el pipeline de parseo:
#
#   1. Archivo aparte (no inline en la ConfigMap): ingress-nginx envuelve el
#      modsecurity-snippet en `modsecurity_rules '...'` (comillas simples), y
#      cualquier comilla simple de una regla rompería el parseo de nginx.
#      En un Include, ModSecurity parsea el contenido directo → comillas OK.
#
#   2. Cada SecRule en UNA sola línea física (sin continuaciones `\`):
#      libmodsecurity v3 es quisquilloso con las continuaciones indentadas y
#      puede cortar la lista de acciones a mitad. Una línea por regla elimina
#      toda ambigüedad. Son largas pero a prueba de balas.
#
# Rango de IDs 99000-99999: reservado por convención del CRS para reglas de
# usuario; no colisiona con el Core Rule Set.
# =============================================================================

# WAF-RULE 99001 · Bloqueo de /actuator/* sensible + índice (Hallazgo H4)
# Preserva /actuator/health (lo usan los probes de Kubernetes). Cubre:
#   - endpoints nombrados: /actuator/info, /actuator/prometheus, ...
#   - acceso vía proxy: /proxy/<svc>/actuator/info
#   - el ÍNDICE /actuator (y /actuator/, /actuator?x), que lista en HAL todos
#     los endpoints disponibles → mapa de reconocimiento para el atacante.
# La alternancia final `/?(?:$|\?|#)` matchea el índice SIN tragarse
# /actuator/health (ahí after `actuator` viene `/health`, no fin/query).
SecRule REQUEST_URI "@rx (?i)(?:^|/)actuator(?:/(?!health(?:$|/|\?))(?:info|metrics|prometheus|env|beans|mappings|configprops|threaddump|heapdump|loggers|caches|sessions|httptrace|conditions|scheduledtasks|auditevents|gateway|refresh|shutdown)|/?(?:$|\?|#))" "id:99001,phase:1,deny,status:403,log,auditlog,msg:'WAF-TS-99001 Acceso bloqueado a endpoint sensible de Spring Actuator',tag:'the-store/H4-actuator-exposed',tag:'OWASP_CRS',tag:'attack-disclosure',tag:'CWE-200',severity:'CRITICAL'"

# WAF-RULE 99002 · Path traversal vía /proxy/* (Hallazgo H1 · SSRF + LFI)
# Detecta `..` literal, %2e%2e (URL-encoded) y %252e%252e (doble URL-encoded).
SecRule REQUEST_URI "@rx (?i)^/proxy/.+/(?:\.\.|%2e%2e|%252e%252e)" "id:99002,phase:1,deny,status:403,log,auditlog,msg:'WAF-TS-99002 Path traversal bloqueado en endpoint /proxy/*',tag:'the-store/H1-proxy-traversal',tag:'OWASP_CRS',tag:'attack-lfi',tag:'attack-ssrf',tag:'CWE-22',tag:'CWE-918',severity:'CRITICAL'"

# WAF-RULE 99003 · /proxy/* hacia rutas administrativas de backends (Hallazgo H1)
# Usa \b (word boundary) tras el grupo: bloquea /proxy/<svc>/actuator,
# /debug, /management o /admin sin necesitar anchor de fin de línea.
SecRule REQUEST_URI "@rx (?i)^/proxy/[^/]+/(?:actuator|debug|management|admin)\b" "id:99003,phase:1,deny,status:403,log,auditlog,msg:'WAF-TS-99003 Acceso a ruta administrativa de backend via proxy bloqueado',tag:'the-store/H1-backend-admin-via-proxy',tag:'OWASP_CRS',tag:'attack-disclosure',tag:'CWE-200',severity:'ERROR'"

# WAF-RULE 99004 · /proxy/* sin cookie de sesión válida (Hallazgo H1)
# El diseño busca denegar /proxy/* que tenga `..` (cubierto por 99002)
# O que "no traiga header de sesión válido" — esta regla cierra esa segunda rama.
# La app emite una cookie SESSIONID (UUID) en la primera visita a `/`
# (ver src/ui/.../SessionIDWebFilter.java); un navegador legítimo siempre la
# reenvía. El front NUNCA llama /proxy/* (cero referencias en templates/JS), así
# que exigir la cookie no rompe ningún flujo real: sólo corta el acceso directo
# por curl/scanner. Chain: deny SOLO si es /proxy/* Y la cookie de sesión falta o
# no tiene formato UUID. Limitación honesta: un atacante puede fabricar una
# SESSIONID con formato UUID; validar la sesión criptográficamente es tarea de la
# app, no del WAF — esto eleva la barrera y cubre el caso por defecto.
# Hacen falta DOS reglas porque cubren estados distintos del header Cookie:
#   99004 · Cookie PRESENTE pero sin SESSIONID con formato UUID válido.
#   99005 · header Cookie totalmente AUSENTE. (libmodsecurity v3 no itera sobre
#           una variable de colección ausente, así que el `!@rx` de 99004 NO
#           dispara cuando no hay ningún Cookie — el caso más común del atacante
#           con curl directo. Por eso 99005 cuenta el header con `&...@eq 0`.)
SecRule REQUEST_URI "@rx (?i)^/proxy/(?:catalog|carts|checkout|orders)(?:/|$)" "id:99004,phase:1,deny,status:403,log,auditlog,msg:'WAF-TS-99004 Acceso a /proxy/* con cookie de sesion invalida',tag:'the-store/H1-proxy-no-session',tag:'OWASP_CRS',tag:'attack-disclosure',tag:'CWE-862',severity:'ERROR',chain"
    SecRule REQUEST_HEADERS:Cookie "!@rx (?i)SESSIONID=[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}" "t:none"
SecRule REQUEST_URI "@rx (?i)^/proxy/(?:catalog|carts|checkout|orders)(?:/|$)" "id:99005,phase:1,deny,status:403,log,auditlog,msg:'WAF-TS-99005 Acceso a /proxy/* sin cookie de sesion',tag:'the-store/H1-proxy-no-session',tag:'OWASP_CRS',tag:'attack-disclosure',tag:'CWE-862',severity:'ERROR',chain"
    SecRule &REQUEST_HEADERS:Cookie "@eq 0"

# WAF-RULE 99010 · Detección de scanners conocidos (Hallazgo H6 · refuerza CRS 913xxx)
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(?:nikto|sqlmap|nuclei|nessus|whatweb|wpscan|dirbuster|gobuster|wfuzz|masscan|zgrab|nmap)" "id:99010,phase:1,deny,status:403,log,auditlog,msg:'WAF-TS-99010 User-Agent de scanner conocido bloqueado',logdata:'UA: %{MATCHED_VAR}',tag:'the-store/H6-scanner-detected',tag:'OWASP_CRS',tag:'attack-reputation-scanner',tag:'CWE-200',severity:'WARNING'"

# WAF-RULE 99020 · Whitelist quirúrgica: CRS 920350 (Host numérico) dispara con
# Host: 127.0.0.1, legítimo en el POC local. Se desactiva solo para localhost.
SecRule REQUEST_HEADERS:Host "@rx (?i)^(?:localhost|127\.0\.0\.1)(?::\d+)?$" "id:99020,phase:1,pass,nolog,ctl:ruleRemoveById=920350"
